name: Bump fff-mcp formula

on:
  schedule:
    # Catch releases even when upstream dispatch is not configured.
    - cron: "30 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without v (empty = latest stable)"
        required: false
        type: string
  repository_dispatch:
    types: [fff-release-published]

concurrency:
  group: bump-fff-mcp-main
  cancel-in-progress: true

permissions:
  contents: write

env:
  FFF_RELEASE_REPO: dmtrKovalenko/fff.nvim
  GH_TOKEN: ${{ github.token }}

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Authorize manual or dispatch trigger
        id: auth
        if: github.event_name != 'schedule'
        env:
          ACTOR: ${{ github.actor }}
          EVENT: ${{ github.event_name }}
          PAYLOAD_SECRET: ${{ github.event.client_payload.bump_secret }}
          TAP_SECRET: ${{ secrets.FFF_RELEASE_BUMP_SECRET }}
        run: |
          set -euo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"
          allowed_actors="jellydn|dmtrKovalenko"
          if [[ "$EVENT" == "workflow_dispatch" ]]; then
            if [[ ! "$ACTOR" =~ ^(${allowed_actors})$ ]]; then
              echo "workflow_dispatch denied for actor: $ACTOR (allowed: jellydn, dmtrKovalenko)" >&2
              exit 1
            fi
            echo "workflow_dispatch authorized for $ACTOR"
            exit 0
          fi
          if [[ "$EVENT" == "repository_dispatch" ]]; then
            if [[ -z "$TAP_SECRET" ]]; then
              echo "::notice::FFF_RELEASE_BUMP_SECRET not set on tap; ignoring dispatch (scheduled poll will sync)"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$PAYLOAD_SECRET" != "$TAP_SECRET" ]]; then
              echo "repository_dispatch rejected: invalid bump_secret" >&2
              exit 1
            fi
            echo "repository_dispatch authorized"
            exit 0
          fi
          echo "Unexpected event for authorization: $EVENT" >&2
          exit 1

      - name: Skipped unconfigured dispatch
        if: steps.auth.outputs.skip == 'true'
        run: echo "No bump performed (dispatch ignored until FFF_RELEASE_BUMP_SECRET is configured on this repo)."

      - uses: actions/checkout@v5
        if: github.event_name == 'schedule' || steps.auth.outputs.skip != 'true'
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        if: github.event_name == 'schedule' || steps.auth.outputs.skip != 'true'
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Resolve target version
        id: version
        if: github.event_name == 'schedule' || steps.auth.outputs.skip != 'true'
        env:
          DISPATCH_VERSION: ${{ github.event.client_payload.version }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          version="${DISPATCH_VERSION:-${INPUT_VERSION:-}}"
          if [[ -z "$version" ]]; then
            version="$(gh release list --repo "$FFF_RELEASE_REPO" --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName' | sed 's/^v//')"
          fi
          version="${version#v}"
          if [[ -z "$version" ]]; then
            echo "No stable release found" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Target version: $version"

      - name: Read current formula version
        id: current
        if: github.event_name == 'schedule' || steps.auth.outputs.skip != 'true'
        run: |
          current="$(grep -E '^\s+v = ' Formula/fff-mcp.rb | sed -E 's/.*"(.*)".*/\1/')"
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "Current formula version: $current"

      - name: Regenerate formula
        if: >-
          (github.event_name == 'schedule' || steps.auth.outputs.skip != 'true')
          && steps.version.outputs.version != steps.current.outputs.version
        run: |
          chmod +x scripts/bump-fff-mcp.sh
          ./scripts/bump-fff-mcp.sh "${{ steps.version.outputs.version }}"

      - name: Commit and push
        if: >-
          (github.event_name == 'schedule' || steps.auth.outputs.skip != 'true')
          && steps.version.outputs.version != steps.current.outputs.version
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/fff-mcp.rb

          if git diff --cached --quiet; then
            echo "No formula changes to commit"
            exit 0
          fi

          git commit -m "chore(fff-mcp): bump to v${{ steps.version.outputs.version }}"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push rejected; rebasing onto latest main (attempt ${attempt}/3)"
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              remote_current="$(git show origin/main:Formula/fff-mcp.rb | grep -E '^\s+v = ' | sed -E 's/.*"(.*)".*/\1/')"

              if [[ "$remote_current" == "${{ steps.version.outputs.version }}" ]]; then
                echo "Remote formula is already at v${{ steps.version.outputs.version }}"
                exit 0
              fi

              echo "Rebase failed and remote formula is at v${remote_current:-unknown}" >&2
              exit 1
            fi
          done

          echo "Failed to push after retries" >&2
          exit 1

      - name: Already up to date
        if: >-
          (github.event_name == 'schedule' || steps.auth.outputs.skip != 'true')
          && steps.version.outputs.version == steps.current.outputs.version
        run: echo "Formula already at v${{ steps.version.outputs.version }}"